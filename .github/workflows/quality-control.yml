name: quality-control
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    quality-control:
        name: Run tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            
            - name: Setup Node 
              uses: actions/setup-node@v6
              with: 
                node-version: 26
                cache: npm
            
            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test

            - name: Run Typescript check
              run: npm run typecheck
            
            - name: Run lint
              run: npm run lint